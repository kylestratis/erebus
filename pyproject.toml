[project]
name = "erebus"
version = "0.1.0"
description = "Erebus - A stateful, continuously-learning AI assistant accessible via Discord. The darkness that works."
authors = [
    {name = "Kyle Stratis", email = "kyle@stratisdatalabs.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    # Discord
    "discord.py>=2.3.0",

    # AI & Agents
    "anthropic>=0.40.0",
    "letta>=0.6.0",

    # MCP
    "mcp>=1.0.0",

    # Productivity APIs
    "todoist-api-python>=2.1.0",
    "PyGithub>=2.1.0",

    # Utilities
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",

    # Logging & Monitoring
    "structlog>=24.1.0",
    "rich>=13.7.0",

    # Scheduling
    "apscheduler>=3.10.0,<4.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",

    # Linting & Formatting
    "ruff>=0.1.0",
    "mypy>=1.7.0",

    # Type stubs
    "types-requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot", "agents", "mcp-servers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "discord.*",
    "letta.*",
    "mcp.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
]
