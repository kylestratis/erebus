# Letta Server with PostgreSQL
#
# Usage (recommended - auto-detects env file):
#   mise run letta:up
#   mise run letta:down
#   mise run letta:logs
#
# Manual usage (from project root):
#   docker compose -f docker/letta/docker-compose.yml --env-file .env.local up -d
#
# Environment variables required (from .env.local or .env in project root):
#   ANTHROPIC_API_KEY - For Claude model access
#   OPENAI_API_KEY - For embeddings (text-embedding-3-small)
#   TODOIST_API_KEY - For Todoist MCP server (native MCP support)

services:
  letta:
    image: letta/letta:latest
    container_name: erebus-letta
    ports:
      - "8283:8283"
    environment:
      # Only pass required API keys (not entire .env file for security)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # MCP server credentials (for native MCP support)
      - TODOIST_API_KEY=${TODOIST_API_KEY}
      # Database connection
      - LETTA_PG_URI=postgresql://letta:letta@postgres:5432/letta
      # Server configuration
      - LETTA_SERVER_HOST=0.0.0.0
      - LETTA_SERVER_PORT=8283
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sL -o /dev/null -w '%{http_code}' http://localhost:8283/v1/models | grep -qE '^2'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: erebus-postgres
    environment:
      - POSTGRES_USER=letta
      - POSTGRES_PASSWORD=letta
      - POSTGRES_DB=letta
    volumes:
      - letta_data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letta -d letta"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  letta_data:
    name: erebus-letta-data
